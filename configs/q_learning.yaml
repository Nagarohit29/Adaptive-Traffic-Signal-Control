# Tabular Q-learning hyperparameters, read by python -m traffic_rl.train --agent q_learning.

env:
  reward_scale: 0.01
  switch_penalty: 0.1

agent:
  alpha: 0.1
  gamma: 0.95
  queue_edges: [3, 7, 13]
  elapsed_edges: [10, 30]

training:
  episodes: 400
  seed: 0
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_fraction: 0.7
  checkpoint_every: 20
