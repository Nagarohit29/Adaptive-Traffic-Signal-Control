[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-rl"
version = "0.1.0"
description = "Reinforcement learning agents for adaptive traffic signal control at a four-way intersection"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "gymnasium==1.4.0",
    "numpy==2.4.6",
    "matplotlib==3.11.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.3",
    "mypy==2.4.0",
    "types-pyyaml==6.0.12.20260906",
]
dqn = [
    "stable-baselines3==2.9.2",
    "torch==2.14.1",
]
sumo = [
    "eclipse-sumo==1.28.0",
    "traci==1.28.0",
]
app = [
    "streamlit==1.66.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/streamlit_app.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["traci", "sumo"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["stable_baselines3", "stable_baselines3.*", "torch", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
